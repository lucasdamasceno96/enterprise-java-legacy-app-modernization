services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petclinic}
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petclinic} -d ${POSTGRES_DB:-petclinic}"]
      interval: 5s
      timeout: 5s
      retries: 12

  petclinic:
    image: ${PETCLINIC_IMAGE:-spring-petclinic:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: "${SERVER_PORT:-8080}"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-petclinic}
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
    ports:
      - "${PETCLINIC_PORT:-8080}:${SERVER_PORT:-8080}"
